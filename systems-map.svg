<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#06060c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.42;transform:scale(1.06)}}
    @keyframes fade1{0%,20%{opacity:0}25%,45%{opacity:.5}50%,100%{opacity:0}}
    @keyframes fade2{25%,45%{opacity:0}50%,70%{opacity:.5}75%,100%{opacity:0}}
    @keyframes fade3{50%,70%{opacity:0}75%,95%{opacity:.5}100%{opacity:0}}
    @keyframes fade4{0%,10%{opacity:0}15%,35%{opacity:.5}40%,100%{opacity:0}}
    @keyframes fade5{10%,30%{opacity:0}35%,55%{opacity:.5}60%,100%{opacity:0}}
    @keyframes fade6{35%,55%{opacity:0}60%,80%{opacity:.5}85%,100%{opacity:0}}
    .orb{animation:spin 90s linear infinite;transform-origin:400px 200px}
    .pulse{animation:pulse 5s ease-in-out infinite}
    .p1{animation:fade1 10s linear infinite}
    .p2{animation:fade2 10s linear infinite}
    .p3{animation:fade3 10s linear infinite}
    .p4{animation:fade4 12s linear infinite}
    .p5{animation:fade5 12s linear infinite}
    .p6{animation:fade6 12s linear infinite}
  </style>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="400" cy="200" r="200" fill="url(#glow)"/>

  <!-- Outer connection ring (subtle) -->
  <circle cx="400" cy="200" r="160" fill="none" stroke="#1a1a2e" stroke-width="0.5" opacity="0.5"/>

  <!-- Orbiting group -->
  <g class="orb">
    <!-- Connection lines to center -->
    <line x1="400" y1="200" x2="400" y2="40"   stroke="#7c5cff" stroke-width="0.6" opacity="0.20"/>
    <line x1="400" y1="200" x2="522.6" y2="97.1" stroke="#7c5cff" stroke-width="0.6" opacity="0.20"/>
    <line x1="400" y1="200" x2="556.5" y2="172.4" stroke="#7c5cff" stroke-width="0.6" opacity="0.20"/>
    <line x1="400" y1="200" x2="538.6" y2="280"  stroke="#7c5cff" stroke-width="0.6" opacity="0.20"/>
    <line x1="400" y1="200" x2="454.7" y2="350.5" stroke="#7c5cff" stroke-width="0.6" opacity="0.20"/>
    <line x1="400" y1="200" x2="345.3" y2="350.5" stroke="#7c5cff" stroke-width="0.6" opacity="0.20"/>
    <line x1="400" y1="200" x2="261.4" y2="280"  stroke="#7c5cff" stroke-width="0.6" opacity="0.20"/>
    <line x1="400" y1="200" x2="243.5" y2="172.4" stroke="#7c5cff" stroke-width="0.6" opacity="0.20"/>
    <line x1="400" y1="200" x2="277.4" y2="97.1" stroke="#7c5cff" stroke-width="0.6" opacity="0.20"/>

    <!-- Inter-node connections -->
    <line x1="400" y1="40"   x2="522.6" y2="97.1"  stroke="#7c5cff" stroke-width="0.4" opacity="0.10"/>
    <line x1="522.6" y1="97.1"  x2="556.5" y2="172.4" stroke="#7c5cff" stroke-width="0.4" opacity="0.10"/>
    <line x1="556.5" y1="172.4" x2="538.6" y2="280"  stroke="#7c5cff" stroke-width="0.4" opacity="0.10"/>
    <line x1="538.6" y1="280"  x2="454.7" y2="350.5" stroke="#7c5cff" stroke-width="0.4" opacity="0.10"/>
    <line x1="454.7" y1="350.5" x2="345.3" y2="350.5" stroke="#7c5cff" stroke-width="0.4" opacity="0.10"/>
    <line x1="345.3" y1="350.5" x2="261.4" y2="280"  stroke="#7c5cff" stroke-width="0.4" opacity="0.10"/>
    <line x1="261.4" y1="280"  x2="243.5" y2="172.4" stroke="#7c5cff" stroke-width="0.4" opacity="0.10"/>
    <line x1="243.5" y1="172.4" x2="277.4" y2="97.1" stroke="#7c5cff" stroke-width="0.4" opacity="0.10"/>
    <line x1="277.4" y1="97.1"  x2="400" y2="40"     stroke="#7c5cff" stroke-width="0.4" opacity="0.10"/>

    <!-- Nodes with glow -->
    <!-- AI -->
    <circle cx="400" cy="40"  r="20" fill="#7c5cff" opacity="0.08"/>
    <circle cx="400" cy="40"  r="14" fill="#0c0c16" stroke="#7c5cff" stroke-width="1.0" opacity="0.70"/>
    <text x="400" y="44" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="600" fill="#7c5cff" letter-spacing="1.2">AI</text>
    <!-- Systems -->
    <circle cx="522.6" cy="97.1"  r="20" fill="#3b82f6" opacity="0.08"/>
    <circle cx="522.6" cy="97.1"  r="14" fill="#0c0c16" stroke="#3b82f6" stroke-width="1.0" opacity="0.70"/>
    <text x="522.6" y="101.1" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="7.5" font-weight="600" fill="#3b82f6" letter-spacing="0.8">SYSTEMS</text>
    <!-- Product -->
    <circle cx="556.5" cy="172.4" r="20" fill="#10b981" opacity="0.08"/>
    <circle cx="556.5" cy="172.4" r="14" fill="#0c0c16" stroke="#10b981" stroke-width="1.0" opacity="0.70"/>
    <text x="556.5" y="176.4" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="7.5" font-weight="600" fill="#10b981" letter-spacing="0.8">PRODUCT</text>
    <!-- Automation -->
    <circle cx="538.6" cy="280"  r="20" fill="#f59e0b" opacity="0.08"/>
    <circle cx="538.6" cy="280"  r="14" fill="#0c0c16" stroke="#f59e0b" stroke-width="1.0" opacity="0.70"/>
    <text x="538.6" y="284" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" font-weight="600" fill="#f59e0b" letter-spacing="0.6">AUTOMATION</text>
    <!-- Blockchain -->
    <circle cx="454.7" cy="350.5" r="20" fill="#ef4444" opacity="0.08"/>
    <circle cx="454.7" cy="350.5" r="14" fill="#0c0c16" stroke="#ef4444" stroke-width="1.0" opacity="0.70"/>
    <text x="454.7" y="354.5" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" font-weight="600" fill="#ef4444" letter-spacing="0.6">BLOCKCHAIN</text>
    <!-- Trading -->
    <circle cx="345.3" cy="350.5" r="20" fill="#ec4899" opacity="0.08"/>
    <circle cx="345.3" cy="350.5" r="14" fill="#0c0c16" stroke="#ec4899" stroke-width="1.0" opacity="0.70"/>
    <text x="345.3" y="354.5" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" font-weight="600" fill="#ec4899" letter-spacing="0.6">TRADING</text>
    <!-- Infrastructure -->
    <circle cx="261.4" cy="280"  r="20" fill="#06b6d4" opacity="0.08"/>
    <circle cx="261.4" cy="280"  r="14" fill="#0c0c16" stroke="#06b6d4" stroke-width="1.0" opacity="0.70"/>
    <text x="261.4" y="284" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="5.5" font-weight="600" fill="#06b6d4" letter-spacing="0.5">INFRASTRUCTURE</text>
    <!-- Open Source -->
    <circle cx="243.5" cy="172.4" r="20" fill="#a855f7" opacity="0.08"/>
    <circle cx="243.5" cy="172.4" r="14" fill="#0c0c16" stroke="#a855f7" stroke-width="1.0" opacity="0.70"/>
    <text x="243.5" y="176.4" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="6.5" font-weight="600" fill="#a855f7" letter-spacing="0.6">OPEN SOURCE</text>
    <!-- Developer Tools -->
    <circle cx="277.4" cy="97.1"  r="20" fill="#14b8a6" opacity="0.08"/>
    <circle cx="277.4" cy="97.1"  r="14" fill="#0c0c16" stroke="#14b8a6" stroke-width="1.0" opacity="0.70"/>
    <text x="277.4" y="101.1" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="5.5" font-weight="600" fill="#14b8a6" letter-spacing="0.4">DEV TOOLS</text>

    <!-- Particle effects along connection lines -->
    <circle r="1.5" fill="#7c5cff" opacity="0" class="p1"><animateMotion dur="10s" repeatCount="indefinite" path="M400,200 L400,40"/></circle>
    <circle r="1.2" fill="#3b82f6" opacity="0" class="p2"><animateMotion dur="10s" repeatCount="indefinite" path="M400,200 L522.6,97.1"/></circle>
    <circle r="1.2" fill="#10b981" opacity="0" class="p3"><animateMotion dur="10s" repeatCount="indefinite" path="M400,200 L556.5,172.4"/></circle>
    <circle r="1.5" fill="#f59e0b" opacity="0" class="p4"><animateMotion dur="12s" repeatCount="indefinite" path="M400,200 L538.6,280"/></circle>
    <circle r="1.2" fill="#ef4444" opacity="0" class="p5"><animateMotion dur="12s" repeatCount="indefinite" path="M400,200 L454.7,350.5"/></circle>
    <circle r="1.2" fill="#ec4899" opacity="0" class="p6"><animateMotion dur="12s" repeatCount="indefinite" path="M400,200 L345.3,350.5"/></circle>

    <!-- Center node -->
    <circle cx="400" cy="200" r="55" fill="url(#cGlow)" class="pulse"/>
    <circle cx="400" cy="200" r="42" fill="#0c0c16" stroke="#7c5cff" stroke-width="1.5" opacity="0.90"/>
    <text x="400" y="195" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#e0e0e0" letter-spacing="2.5">MAJID</text>
    <text x="400" y="212" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="7" font-weight="400" fill="#7c5cff" letter-spacing="3.0" opacity="0.80">ASGHARI</text>
  </g>
</svg>
